[project]
name = "factory"
version = "0.1.0"
description = "Local software factory: tickets, state machine, dsh workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "zstandard>=0.23",
  "blake3>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
factory-api = "factory.api:main"
factory-runner = "factory.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
